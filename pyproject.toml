[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uk-business-mcp"
version = "0.1.1"
description = "One MCP server for UK business — GOV.UK, legal, due diligence, and property tools behind a single URL."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "uk", "business", "legal", "govuk", "property", "fastmcp"]
authors = [
    { name = "Paul Boucherat", email = "paul@bouch.dev" },
]
dependencies = [
    "fastmcp==3.2.4",
    "mcp==1.27.0",
    "pydantic==2.13.0",
    "httpx==0.28.1",
    "uvicorn==0.44.0",
    # zstandard is required for any FastMCP proxy that talks to Fly.io-hosted
    # upstreams: Fly's edge compresses MCP responses with zstd, and without
    # this decoder every upstream tools/list fails silently (see Lesson 30).
    # We currently get it transitively via httpx, but pin explicitly so a
    # future dep resolution doesn't drop it.
    "zstandard>=0.22.0",
    # brotli is required for the same reason as zstandard: Fly's edge will
    # serve Content-Encoding: br to clients that advertise it (and sometimes
    # even when they don't). Without a brotli decoder, raw compressed bytes
    # reach JSONRPCMessage.model_validate_json and surface as
    # ValidationError "Invalid JSON" in mcp.client.streamable_http.
    "brotli>=1.1.0",
    # prometheus-client backs /metrics and the client_connections_total counter.
    # NOTE: the Dockerfile pins this list AGAIN, inline — adding a dep here alone
    # gives a green local venv and an ImportError at boot. Both files, every time.
    "prometheus-client>=0.21",
]

[project.urls]
Homepage = "https://github.com/paulieb89/uk-business-mcp"
Repository = "https://github.com/paulieb89/uk-business-mcp"

[project.scripts]
uk-business-mcp = "server:main"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]

[tool.hatch.build.targets.sdist]
exclude = ["fly.toml", "Dockerfile", ".mcp.json", "dist/", "uv.lock"]
